<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2FA 双因素认证 - 安全令牌生成器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/otpauth/9.3.1/otpauth.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-start: #0a0a1a;
            --bg-mid: #0f1a2e;
            --bg-end: #0d1525;
            --glass-bg: rgba(255,255,255,0.04);
            --glass-border: rgba(255,255,255,0.08);
            --glass-hover: rgba(255,255,255,0.07);
            --blue-500: #3b82f6;
            --blue-400: #60a5fa;
            --blue-300: #93bbfd;
            --teal-500: #10b981;
            --teal-400: #34d399;
            --teal-300: #6ee7b7;
            --red-400: #f87171;
            --white: #ffffff;
            --text-primary: rgba(255,255,255,0.92);
            --text-secondary: rgba(255,255,255,0.6);
            --text-muted: rgba(255,255,255,0.35);
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 20px;
            --radius-xl: 28px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* ============ 动态渐变背景 ============ */
        body {
            font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: var(--bg-start);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            position: relative;
        }
        .bg-animated {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .bg-gradient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            animation: floatOrb 12s ease-in-out infinite;
        }
        .bg-gradient-orb:nth-child(1) {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(59,130,246,0.35) 0%, transparent 70%);
            top: -15%; left: -10%;
            animation-delay: 0s;
        }
        .bg-gradient-orb:nth-child(2) {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(16,185,129,0.3) 0%, transparent 70%);
            top: 30%; right: -8%;
            animation-delay: -4s;
        }
        .bg-gradient-orb:nth-child(3) {
            width: 450px; height: 450px;
            background: radial-gradient(circle, rgba(139,92,246,0.25) 0%, transparent 70%);
            bottom: -10%; left: 30%;
            animation-delay: -8s;
        }
        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, -50px) scale(1.15); }
            66% { transform: translate(-30px, 30px) scale(0.9); }
        }

        /* ============ 浮动粒子 ============ */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            width: 3px; height: 3px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            animation: particleFloat linear infinite;
        }
        @keyframes particleFloat {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* ============ 毛玻璃头部 ============ */
        .header {
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            background: rgba(10,10,26,0.6);
            border-bottom: 1px solid var(--glass-border);
            padding: 0 40px; height: 64px;
            display: flex; align-items: center; justify-content: space-between;
            transition: background 0.3s;
        }
        .header-logo {
            display: flex; align-items: center; gap: 12px;
            color: var(--white); font-weight: 700; font-size: 18px;
            text-decoration: none;
        }
        .header-logo-icon {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, var(--teal-500), var(--blue-500));
            border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            box-shadow: 0 0 20px rgba(16,185,129,0.3);
            animation: logoPulse 3s ease-in-out infinite;
        }
        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(16,185,129,0.3); }
            50% { box-shadow: 0 0 35px rgba(59,130,246,0.5); }
        }
        .header-nav { display: flex; gap: 8px; }
        .header-nav a {
            color: var(--text-secondary); text-decoration: none;
            font-size: 14px; font-weight: 500;
            padding: 8px 16px; border-radius: 20px;
            transition: all 0.3s;
            position: relative; overflow: hidden;
        }
        .header-nav a:hover {
            color: var(--white);
            background: rgba(255,255,255,0.08);
        }
        .header-nav a::after {
            content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 0; height: 2px; background: var(--teal-400);
            border-radius: 1px; transition: width 0.3s;
        }
        .header-nav a:hover::after { width: 60%; }

        /* ============ 英雄区域 ============ */
        .hero {
            position: relative; z-index: 1;
            padding: 60px 40px; text-align: center;
        }
        .hero-glass {
            max-width: 800px; margin: 0 auto;
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 48px 40px;
            animation: fadeInUp 0.8s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hero h1 {
            font-size: 44px; font-weight: 900;
            letter-spacing: -1px; line-height: 1.15;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #fff 0%, var(--teal-300) 50%, var(--blue-300) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero p {
            font-size: 16px; color: var(--text-secondary);
            max-width: 520px; margin: 0 auto 28px;
            line-height: 1.7;
        }
        .hero-stats {
            display: flex; gap: 40px; justify-content: center;
        }
        .hero-stat {
            text-align: center;
            animation: fadeInUp 0.8s ease-out backwards;
        }
        .hero-stat:nth-child(2) { animation-delay: 0.15s; }
        .hero-stat:nth-child(3) { animation-delay: 0.3s; }
        .hero-stat-num {
            font-size: 30px; font-weight: 900;
            background: linear-gradient(135deg, var(--teal-400), var(--blue-400));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero-stat-label {
            font-size: 12px; color: var(--text-muted);
            margin-top: 4px; letter-spacing: 0.5px;
        }

        /* ============ 主容器 ============ */
        .container {
            max-width: 1100px; margin: 0 auto;
            padding: 0 40px 60px;
            position: relative; z-index: 1;
        }

        /* ============ 毛玻璃卡片 ============ */
        .card {
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 32px; margin-bottom: 24px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeInUp 0.6s ease-out backwards;
        }
        .card:hover {
            border-color: rgba(255,255,255,0.15);
            box-shadow: 0 8px 40px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.05) inset;
            transform: translateY(-2px);
        }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 24px;
        }
        .card-title {
            font-size: 18px; font-weight: 700;
            color: var(--white);
        }
        .card-badge {
            background: rgba(16,185,129,0.15);
            color: var(--teal-400);
            padding: 5px 14px; border-radius: 16px;
            font-size: 12px; font-weight: 600;
            border: 1px solid rgba(16,185,129,0.2);
        }

        /* ============ 输入框 ============ */
        .input-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .input-group { flex: 1; min-width: 200px; }
        .input-group label {
            display: block; font-size: 11px; font-weight: 600;
            color: var(--text-muted); margin-bottom: 6px;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .input-group input, .input-group select {
            width: 100%; padding: 12px 16px;
            border: 1.5px solid rgba(255,255,255,0.08);
            border-radius: var(--radius-sm);
            font-size: 14px; font-family: inherit;
            color: var(--white);
            background: rgba(255,255,255,0.04);
            outline: none;
            transition: all 0.3s;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: rgba(59,130,246,0.5);
            background: rgba(59,130,246,0.06);
            box-shadow: 0 0 0 4px rgba(59,130,246,0.08);
        }
        .input-group select { cursor: pointer; }
        .input-group select option {
            background: #1a1a2e; color: var(--white);
        }

        /* ============ 按钮 ============ */
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 6px; padding: 10px 22px; border-radius: 25px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            border: none; font-family: inherit; white-space: nowrap;
            transition: all 0.3s;
            position: relative; overflow: hidden;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--blue-500), #2563eb);
            color: var(--white);
            box-shadow: 0 4px 15px rgba(59,130,246,0.25);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59,130,246,0.4);
        }
        .btn-primary:active { transform: translateY(0); }
        .btn-teal {
            background: linear-gradient(135deg, var(--teal-500), #059669);
            color: var(--white);
            box-shadow: 0 4px 15px rgba(16,185,129,0.25);
        }
        .btn-teal:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16,185,129,0.4);
        }
        .btn-teal:active { transform: translateY(0); }
        .btn-sm { padding: 7px 16px; font-size: 12px; border-radius: 18px; }

        /* 波纹效果 */
        .btn .ripple {
            position: absolute; border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: scale(0); animation: rippleEffect 0.6s ease-out forwards;
            pointer-events: none;
        }
        @keyframes rippleEffect {
            to { transform: scale(4); opacity: 0; }
        }

        .btn-icon {
            width: 36px; height: 36px; padding: 0; border-radius: 50%;
            font-size: 16px;
            background: rgba(255,255,255,0.05);
            color: var(--text-secondary);
            border: 1px solid rgba(255,255,255,0.06);
            cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            transition: all 0.3s;
        }
        .btn-icon:hover {
            background: rgba(255,255,255,0.1);
            color: var(--white);
            transform: scale(1.1);
        }
        .btn-icon.danger:hover {
            background: rgba(248,113,113,0.15);
            color: var(--red-400);
            border-color: rgba(248,113,113,0.3);
        }

        /* ============ 令牌展示区 ============ */
        .token-display {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 28px 36px;
            display: flex; align-items: center;
            justify-content: space-between; gap: 24px;
            margin-bottom: 24px;
            position: relative; overflow: hidden;
        }
        .token-display::before {
            content: '';
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at 30% 50%, rgba(16,185,129,0.08) 0%, transparent 60%);
            pointer-events: none;
        }
        .token-display::after {
            content: '';
            position: absolute; top: 0; left: -100%;
            width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
            animation: shimmer 3s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%, 100% { left: -100%; }
            50% { left: 150%; }
        }
        .token-left { position: relative; z-index: 1; }
        .token-label {
            font-size: 11px; color: var(--text-muted);
            font-weight: 600; text-transform: uppercase;
            letter-spacing: 1px; margin-bottom: 8px;
        }
        .token-code {
            font-size: 46px; font-weight: 900; letter-spacing: 8px;
            color: var(--white); font-family: 'Inter', monospace;
            line-height: 1; position: relative;
            text-shadow: 0 0 30px rgba(16,185,129,0.4);
            animation: codeGlow 2s ease-in-out infinite;
        }
        @keyframes codeGlow {
            0%, 100% { text-shadow: 0 0 30px rgba(16,185,129,0.4); }
            50% { text-shadow: 0 0 50px rgba(59,130,246,0.6), 0 0 80px rgba(16,185,129,0.3); }
        }
        .token-code span { color: var(--teal-400); }
        .token-countdown {
            display: flex; flex-direction: column; align-items: center;
            gap: 6px; position: relative; z-index: 1;
        }
        .token-countdown-circle {
            width: 52px; height: 52px; border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.12);
            display: flex; align-items: center; justify-content: center;
            transition: border-color 0.5s;
            animation: countPulse 1s ease-in-out infinite;
        }
        @keyframes countPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .token-countdown-num {
            font-size: 20px; font-weight: 800;
            color: var(--teal-400);
            transition: color 0.5s;
        }
        .token-countdown-label {
            font-size: 10px; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 1px;
            font-weight: 600;
        }

        /* ============ 搜索栏 ============ */
        .search-bar { position: relative; margin-bottom: 16px; }
        .search-bar input {
            width: 100%; padding: 12px 16px 12px 42px;
            border: 1.5px solid rgba(255,255,255,0.08);
            border-radius: 25px; font-size: 14px; font-family: inherit;
            color: var(--white);
            background: rgba(255,255,255,0.04);
            outline: none;
            transition: all 0.3s;
        }
        .search-bar input:focus {
            border-color: rgba(59,130,246,0.5);
            background: rgba(59,130,246,0.06);
            box-shadow: 0 0 0 4px rgba(59,130,246,0.08);
        }
        .search-bar svg {
            position: absolute; left: 14px; top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* ============ 分类标签 ============ */
        .category-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .category-tab {
            padding: 7px 18px; border-radius: 20px; font-size: 13px; font-weight: 500;
            cursor: pointer;
            border: 1.5px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03);
            color: var(--text-secondary);
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .category-tab:hover {
            border-color: rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.06);
        }
        .category-tab.active {
            background: rgba(59,130,246,0.2);
            color: var(--blue-300);
            border-color: rgba(59,130,246,0.4);
            box-shadow: 0 0 20px rgba(59,130,246,0.15);
        }

        /* ============ 账户卡片 ============ */
        .account-card {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 22px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: var(--radius);
            margin-bottom: 10px; gap: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeInUp 0.4s ease-out backwards;
        }
        .account-card:hover {
            background: var(--glass-hover);
            border-color: rgba(255,255,255,0.15);
            transform: translateX(4px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .account-info { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1; }
        .account-avatar {
            width: 44px; height: 44px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--blue-500), var(--teal-500));
            color: var(--white);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 18px; flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(59,130,246,0.2);
        }
        .account-name {
            font-size: 14px; font-weight: 600; color: var(--white);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .account-meta {
            font-size: 11px; color: var(--text-muted);
            margin-top: 3px; display: flex; gap: 8px;
        }
        .account-code {
            font-size: 24px; font-weight: 800; letter-spacing: 4px;
            color: var(--teal-400);
            font-family: 'Inter', monospace;
            text-shadow: 0 0 15px rgba(16,185,129,0.3);
        }
        .account-progress {
            width: 3px; height: 34px;
            background: rgba(255,255,255,0.06);
            border-radius: 2px; overflow: hidden;
        }
        .account-progress-fill {
            width: 100%;
            background: linear-gradient(to top, var(--teal-500), var(--teal-400));
            border-radius: 2px;
            transition: height 0.8s linear;
            box-shadow: 0 0 8px rgba(16,185,129,0.3);
        }
        .account-actions { display: flex; gap: 6px; }

        .empty-state {
            text-align: center; padding: 56px 20px;
            color: var(--text-muted);
        }
        .empty-state-icon {
            font-size: 48px; margin-bottom: 12px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* ============ 选项芯片 ============ */
        .options-grid { display: flex; gap: 10px; flex-wrap: wrap; }
        .option-chip {
            padding: 9px 18px; border-radius: 20px;
            font-size: 13px; font-weight: 500; cursor: pointer;
            border: 1.5px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03);
            color: var(--text-secondary);
            transition: all 0.3s;
        }
        .option-chip:hover {
            border-color: rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.06);
        }
        .option-chip.active {
            background: rgba(59,130,246,0.2);
            color: var(--blue-300);
            border-color: var(--blue-500);
            box-shadow: 0 0 20px rgba(59,130,246,0.2);
        }

        /* ============ 页脚 ============ */
        .footer {
            position: relative; z-index: 1;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(10,10,26,0.5);
            border-top: 1px solid var(--glass-border);
            padding: 24px 40px; text-align: center;
            color: var(--text-muted); font-size: 13px;
        }
        .footer a {
            color: var(--teal-400); text-decoration: none;
            transition: color 0.3s;
        }
        .footer a:hover { color: var(--teal-300); }

        /* ============ 提示消息 ============ */
        .toast {
            position: fixed; bottom: 40px; left: 50%;
            transform: translateX(-50%) translateY(120px);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            background: rgba(15,23,42,0.85);
            color: var(--white); padding: 14px 28px;
            border-radius: 28px; font-size: 14px; font-weight: 500;
            z-index: 1000; opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .toast.show {
            opacity: 1; transform: translateX(-50%) translateY(0);
        }

        /* ============ 响应式 ============ */
        @media (max-width: 768px) {
            .header { padding: 0 16px; }
            .header-nav { display: none; }
            .hero { padding: 36px 16px; }
            .hero-glass { padding: 32px 20px; }
            .hero h1 { font-size: 28px; }
            .hero-stats { gap: 20px; }
            .hero-stat-num { font-size: 22px; }
            .container { padding: 0 16px 40px; }
            .card { padding: 20px; }
            .token-code { font-size: 30px; letter-spacing: 5px; }
            .token-display { padding: 16px 20px; flex-direction: column; align-items: flex-start; }
            .input-row { flex-direction: column; }
            .account-card { flex-wrap: wrap; }
            .account-code { font-size: 20px; }
        }
    </style>
</head>
<body>

<!-- 动态背景 -->
<div class="bg-animated">
    <div class="bg-gradient-orb"></div>
    <div class="bg-gradient-orb"></div>
    <div class="bg-gradient-orb"></div>
</div>

<!-- 浮动粒子 -->
<div class="particles" id="particles"></div>

<!-- 头部 -->
<header class="header" id="header">
    <div class="header-logo">
        <div class="header-logo-icon">🔐</div>
        <span>两步验证</span>
    </div>
    <nav class="header-nav">
        <a href="#generator">令牌生成</a>
        <a href="#accounts">账户管理</a>
    </nav>
</header>

<!-- 英雄区域 -->
<section class="hero">
    <div class="hero-glass">
        <h1>安全可靠的双因素认证</h1>
        <p>企业级 TOTP 令牌生成器，支持 SHA1/SHA256/SHA512 算法与自定义时间周期。所有密钥仅保存在您的浏览器本地，绝不上传。</p>
        <div class="hero-stats">
            <div class="hero-stat">
                <div class="hero-stat-num" id="stat-total">0</div>
                <div class="hero-stat-label">已保存账户</div>
            </div>
            <div class="hero-stat">
                <div class="hero-stat-num" id="stat-copied">0</div>
                <div class="hero-stat-label">今日复制次数</div>
            </div>
            <div class="hero-stat">
                <div class="hero-stat-num" id="stat-time">--:--</div>
                <div class="hero-stat-label">当前时间</div>
            </div>
        </div>
    </div>
</section>

<!-- 主内容 -->
<main class="container">
    <!-- 令牌生成器 -->
    <div class="card" id="generator">
        <div class="card-header">
            <h2 class="card-title">🔑 令牌生成器</h2>
            <span class="card-badge">TOTP</span>
        </div>
        <div class="token-display">
            <div class="token-left">
                <div class="token-label">当前令牌</div>
                <div class="token-code" id="live-token">
                    <span>-</span><span>-</span><span>-</span> <span>-</span><span>-</span><span>-</span>
                </div>
            </div>
            <div class="token-countdown">
                <div class="token-countdown-circle">
                    <span class="token-countdown-num" id="live-countdown">30</span>
                </div>
                <span class="token-countdown-label">秒</span>
            </div>
            <div>
                <button class="btn btn-primary btn-sm" onclick="copyLiveToken()">📋 复制令牌</button>
            </div>
        </div>
        <div class="input-row">
            <div class="input-group" style="flex:2">
                <label>密钥 (Base32)</label>
                <input type="text" id="secretInput" placeholder="例如：JBSWY3DPEHPK3PXP..." autocomplete="off">
            </div>
            <div class="input-group">
                <label>账户名称</label>
                <input type="text" id="nameInput" placeholder="例如：Google、GitHub..." autocomplete="off">
            </div>
        </div>
        <div style="margin-bottom:12px;">
            <label style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:8px;">令牌位数</label>
            <div class="options-grid" id="digits-options">
                <span class="option-chip active" data-value="6">6 位</span>
                <span class="option-chip" data-value="8">8 位</span>
            </div>
        </div>
        <div style="margin-bottom:12px;">
            <label style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:8px;">更新周期</label>
            <div class="options-grid" id="period-options">
                <span class="option-chip" data-value="15">15 秒</span>
                <span class="option-chip active" data-value="30">30 秒</span>
                <span class="option-chip" data-value="60">60 秒</span>
            </div>
        </div>
        <div style="margin-bottom:16px;">
            <label style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:8px;">加密算法</label>
            <div class="options-grid" id="algorithm-options">
                <span class="option-chip active" data-value="SHA1">SHA1</span>
                <span class="option-chip" data-value="SHA256">SHA256</span>
                <span class="option-chip" data-value="SHA512">SHA512</span>
            </div>
        </div>
        <div class="input-group" style="margin-bottom:20px;max-width:240px;">
            <label>分类</label>
            <select id="categorySelect">
                <option value="social">社交</option>
                <option value="finance">金融</option>
                <option value="work">工作</option>
                <option value="gaming">游戏</option>
                <option value="other">其他</option>
            </select>
        </div>
        <button class="btn btn-teal" onclick="saveAccount()" style="width:100%;justify-content:center;padding:14px;font-size:15px;">
            ➕ 添加账户
        </button>
    </div>

    <!-- 账户列表 -->
    <div class="card" id="accounts">
        <div class="card-header">
            <h2 class="card-title">📁 已保存的账户</h2>
            <span class="card-badge" id="accountCount">0 个</span>
        </div>
        <div class="search-bar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="searchInput" placeholder="搜索账户..." autocomplete="off">
        </div>
        <div class="category-tabs" id="categoryTabs">
            <span class="category-tab active" data-category="all">全部</span>
            <span class="category-tab" data-category="social">社交</span>
            <span class="category-tab" data-category="finance">金融</span>
            <span class="category-tab" data-category="work">工作</span>
            <span class="category-tab" data-category="gaming">游戏</span>
            <span class="category-tab" data-category="other">其他</span>
        </div>
        <div id="accountsList"></div>
    </div>
</main>

<footer class="footer">
    <p>🔒 所有密钥均存储在您的浏览器本地。数据不会上传至任何服务器。 <a href="#" onclick="clearAll();return false;">清除全部数据</a></p>
</footer>

<div class="toast" id="toast"></div>

<script>
// ============ 数据管理 ============
var AK = 'fa_auth_accounts_v2', SK = 'fa_auth_stats_v2';

function getAccounts() {
    try { return JSON.parse(localStorage.getItem(AK) || '[]'); }
    catch(e) { return []; }
}
function saveAccounts(a) { localStorage.setItem(AK, JSON.stringify(a)); }

var ct = null, cc = 'all', copied = 0;

// ============ 粒子效果 ============
(function initParticles() {
    var container = document.getElementById('particles');
    var frag = document.createDocumentFragment();
    for (var i = 0; i < 40; i++) {
        var p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (8 + Math.random() * 16) + 's';
        p.style.animationDelay = Math.random() * 12 + 's';
        p.style.width = (2 + Math.random() * 4) + 'px';
        p.style.height = p.style.width;
        p.style.opacity = (0.1 + Math.random() * 0.3);
        frag.appendChild(p);
    }
    container.appendChild(frag);
})();

// ============ 按钮波纹效果 ============
document.addEventListener('click', function(e) {
    var btn = e.target.closest('.btn');
    if (!btn) return;
    var ripple = document.createElement('span');
    ripple.className = 'ripple';
    var rect = btn.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
    btn.appendChild(ripple);
    ripple.addEventListener('animationend', function() { ripple.remove(); });
});

// ============ 选项芯片点击 ============
document.querySelectorAll('.option-chip').forEach(function(c) {
    c.addEventListener('click', function() {
        this.parentElement.querySelectorAll('.option-chip').forEach(function(x) { x.classList.remove('active'); });
        this.classList.add('active');
        updateGenerator();
    });
});

function getSel(id) {
    var e = document.getElementById(id).querySelector('.option-chip.active');
    return e ? e.dataset.value : null;
}

// ============ 令牌生成 ============
var si = document.getElementById('secretInput');
si.addEventListener('input', updateGenerator);

function updateGenerator() {
    var s = si.value.replace(/\s+/g, '').toUpperCase();
    if (!s || s.length < 8) {
        ct = null;
        document.getElementById('live-token').innerHTML = '<span>-</span><span>-</span><span>-</span> <span>-</span><span>-</span><span>-</span>';
        return;
    }
    var d = parseInt(getSel('digits-options'));
    var p = parseInt(getSel('period-options'));
    var a = getSel('algorithm-options');
    try {
        ct = new OTPAuth.TOTP({ issuer: '2FA', label: 'Token', algorithm: a, digits: d, period: p, secret: OTPAuth.Secret.fromBase32(s) });
        updateTokenDisplay();
    } catch(e) { ct = null; }
}

function updateTokenDisplay() {
    if (!ct) return;
    try {
        var t = ct.generate();
        var dt = t.length === 8
            ? '<span>' + t.slice(0,4) + '</span> <span>' + t.slice(4) + '</span>'
            : '<span>' + t.slice(0,3) + '</span> <span>' + t.slice(3) + '</span>';
        document.getElementById('live-token').innerHTML = dt;

        var ep = Math.floor(Date.now() / 1000);
        var pe = ct.period;
        var r = pe - (ep % pe);
        document.getElementById('live-countdown').textContent = r;

        var c = document.querySelector('.token-countdown-circle');
        var pct = (r / pe) * 100;
        var color = pct > 30 ? 'rgba(16,185,129,0.4)' : 'rgba(248,113,113,0.5)';
        c.style.borderColor = color;
        document.getElementById('live-countdown').style.color = pct > 30 ? 'var(--teal-400)' : '#f87171';
    } catch(e) {}
}

// ============ 复制令牌 ============
function copyLiveToken() {
    if (!ct) { showToast('⚠️ 请先输入有效的密钥'); return; }
    copyToClipboard(ct.generate(), '✅ 令牌已复制！');
    incCopied();
}

// ============ 保存账户 ============
function saveAccount() {
    var s = si.value.replace(/\s+/g, '').toUpperCase();
    var n = document.getElementById('nameInput').value.trim();
    if (!s || s.length < 8) { showToast('⚠️ 请输入有效的密钥'); return; }
    var accts = getAccounts();
    if (accts.find(function(a) { return a.secret === s; })) {
        showToast('⚠️ 该密钥已存在');
        return;
    }
    var d = parseInt(getSel('digits-options'));
    var p = parseInt(getSel('period-options'));
    var alg = getSel('algorithm-options');
    var cat = document.getElementById('categorySelect').value;
    var an = n || '账户 ' + (accts.length + 1);
    accts.push({ name: an, secret: s, category: cat, digits: d, period: p, algorithm: alg, createdAt: Date.now() });
    saveAccounts(accts);
    renderAccounts();
    updateStats();
    showToast('✅ 账户「' + an + '」已保存');
    si.value = '';
    document.getElementById('nameInput').value = '';
    updateGenerator();
}

// ============ 渲染账户列表 ============
function renderAccounts() {
    var el = document.getElementById('accountsList');
    var accts = getAccounts();
    var q = document.getElementById('searchInput').value.toLowerCase().trim();
    if (q) accts = accts.filter(function(a) { return a.name.toLowerCase().includes(q); });
    if (cc !== 'all') accts = accts.filter(function(a) { return a.category === cc; });

    document.getElementById('accountCount').textContent = getAccounts().length + ' 个';

    if (accts.length === 0) {
        el.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><p>' +
            (q ? '没有匹配的账户' : '还没有账户，在上方添加一个吧！') + '</p></div>';
        return;
    }

    el.innerHTML = accts.map(function(a, i) {
        var init = a.name.charAt(0).toUpperCase();
        var cd = '------', prog = 30;
        try {
            var pe = a.period || 30;
            var totp = new OTPAuth.TOTP({ issuer: '2FA', label: a.name, algorithm: a.algorithm || 'SHA1', digits: a.digits || 6, period: pe, secret: OTPAuth.Secret.fromBase32(a.secret) });
            var t = totp.generate();
            cd = t.length === 8 ? t.slice(0,4) + ' ' + t.slice(4) : t.slice(0,3) + ' ' + t.slice(3);
            var ep = Math.floor(Date.now() / 1000);
            prog = pe - (ep % pe);
        } catch(e) {}

        return '<div class="account-card" style="animation-delay:' + (i * 0.05) + 's">' +
            '<div class="account-info">' +
                '<div class="account-avatar">' + init + '</div>' +
                '<div class="account-details">' +
                    '<div class="account-name">' + escapeHtml(a.name) + '</div>' +
                    '<div class="account-meta">' +
                        '<span>' + (a.algorithm || 'SHA1') + '</span>' +
                        '<span>' + (a.digits || 6) + '位</span>' +
                        '<span>' + (a.period || 30) + '秒</span>' +
                        '<span>' + categoryLabel(a.category) + '</span>' +
                    '</div>' +
                '</div>' +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:12px;">' +
                '<div class="account-code" id="code-' + i + '">' + cd + '</div>' +
                '<div class="account-progress"><div class="account-progress-fill" id="progress-' + i + '" style="height:' + ((prog/(a.period||30))*100) + '%"></div></div>' +
                '<div class="account-actions">' +
                    '<button class="btn-icon" onclick="copyAcct(' + i + ')" title="复制令牌">📋</button>' +
                    '<button class="btn-icon danger" onclick="delAcct(' + i + ')" title="删除账户">🗑️</button>' +
                '</div>' +
            '</div>' +
        '</div>';
    }).join('');
}

function categoryLabel(c) {
    var map = { social: '社交', finance: '金融', work: '工作', gaming: '游戏', other: '其他' };
    return map[c] || c;
}

// ============ 复制账户令牌 ============
function copyAcct(i) {
    var accts = getAccounts(), f = filterAccts(accts), a = f[i];
    if (!a) return;
    try {
        var totp = new OTPAuth.TOTP({ issuer: '2FA', label: a.name, algorithm: a.algorithm || 'SHA1', digits: a.digits || 6, period: a.period || 30, secret: OTPAuth.Secret.fromBase32(a.secret) });
        copyToClipboard(totp.generate(), '✅「' + a.name + '」令牌已复制！');
        incCopied();
    } catch(e) { showToast('⚠️ 生成令牌失败'); }
}

// ============ 删除账户 ============
function delAcct(i) {
    var accts = getAccounts(), f = filterAccts(accts), a = f[i];
    if (!a) return;
    var ri = accts.findIndex(function(x) { return x.secret === a.secret; });
    if (ri === -1) return;
    if (!confirm('确定要删除账户「' + a.name + '」吗？此操作不可撤销。')) return;
    accts.splice(ri, 1);
    saveAccounts(accts);
    renderAccounts();
    updateStats();
    showToast('🗑️ 账户「' + a.name + '」已删除');
}

function filterAccts(accts) {
    var q = document.getElementById('searchInput').value.toLowerCase().trim();
    var f = accts;
    if (cc !== 'all') f = f.filter(function(a) { return a.category === cc; });
    if (q) f = f.filter(function(a) { return a.name.toLowerCase().includes(q); });
    return f;
}

// ============ 实时更新所有令牌 ============
function updateAllCodes() {
    if (ct) updateTokenDisplay();
    var accts = getAccounts(), f = filterAccts(accts);
    f.forEach(function(a, i) {
        var ce = document.getElementById('code-' + i);
        var pe = document.getElementById('progress-' + i);
        if (!ce) return;
        try {
            var per = a.period || 30;
            var totp = new OTPAuth.TOTP({ issuer: '2FA', label: a.name, algorithm: a.algorithm || 'SHA1', digits: a.digits || 6, period: per, secret: OTPAuth.Secret.fromBase32(a.secret) });
            var t = totp.generate();
            ce.textContent = t.length === 8 ? t.slice(0,4) + ' ' + t.slice(4) : t.slice(0,3) + ' ' + t.slice(3);
            if (pe) {
                var ep = Math.floor(Date.now() / 1000), r = per - (ep % per);
                pe.style.height = ((r / per) * 100) + '%';
            }
        } catch(e) {}
    });
}

// ============ 分类筛选 ============
document.querySelectorAll('.category-tab').forEach(function(t) {
    t.addEventListener('click', function() {
        document.querySelectorAll('.category-tab').forEach(function(x) { x.classList.remove('active'); });
        t.classList.add('active');
        cc = t.dataset.category;
        renderAccounts();
    });
});

document.getElementById('searchInput').addEventListener('input', function() { renderAccounts(); });

// ============ 统计信息 ============
function updateStats() {
    document.getElementById('stat-total').textContent = getAccounts().length;
    loadCopied();
}
function loadCopied() {
    try {
        var s = JSON.parse(localStorage.getItem(SK) || '{}');
        var t = new Date().toDateString();
        copied = s.date === t ? (s.count || 0) : 0;
        document.getElementById('stat-copied').textContent = copied;
    } catch(e) { copied = 0; }
}
function incCopied() {
    var t = new Date().toDateString();
    copied++;
    localStorage.setItem(SK, JSON.stringify({ date: t, count: copied }));
    document.getElementById('stat-copied').textContent = copied;
}
function updateTime() {
    var n = new Date();
    document.getElementById('stat-time').textContent =
        n.getHours().toString().padStart(2, '0') + ':' + n.getMinutes().toString().padStart(2, '0');
}

// ============ 剪贴板工具 ============
function copyToClipboard(text, msg) {
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(function() { showToast(msg); });
    } else {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); showToast(msg); } catch(e) {}
        document.body.removeChild(ta);
    }
}

// ============ Toast 通知 ============
function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timeout);
    t._timeout = setTimeout(function() { t.classList.remove('show'); }, 2500);
}

// ============ 工具函数 ============
function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}
function clearAll() {
    if (confirm('⚠️ 确定要删除全部账户数据吗？此操作不可撤销！')) {
        localStorage.clear();
        renderAccounts();
        updateStats();
        showToast('🗑️ 所有数据已清除');
    }
}

// ============ 键盘快捷键 ============
si.addEventListener('keydown', function(e) { if (e.key === 'Enter') document.getElementById('nameInput').focus(); });
document.getElementById('nameInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') saveAccount(); });

// ============ 平滑滚动 ============
document.querySelectorAll('.header-nav a').forEach(function(a) {
    a.addEventListener('click', function(e) {
        e.preventDefault();
        var target = document.querySelector(this.getAttribute('href'));
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
});

// ============ 初始化 ============
setInterval(updateAllCodes, 1000);
setInterval(updateTime, 10000);
updateStats();
updateTime();
renderAccounts();
updateGenerator();
</script>
</body>
</html>
